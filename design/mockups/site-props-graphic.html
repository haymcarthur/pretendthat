<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  body{width:1300px;height:1010px;background:#fff;font-family:Poppins,sans-serif;position:relative;overflow:hidden}
  .shadow{position:absolute;left:120px;top:912px;width:420px;height:46px;border-radius:50%;background:radial-gradient(closest-side,rgba(63,26,96,.14),rgba(63,26,96,0))}
  .nutmeg{position:absolute;left:70px;top:150px;width:560px}
  .card{position:absolute;display:flex;align-items:center;gap:22px;background:#fff;border-radius:34px;padding:22px 26px;
        box-shadow:0 26px 60px rgba(42,24,70,.12),0 2px 6px rgba(42,24,70,.06);font-size:30px;line-height:1.2;width:540px;white-space:nowrap;box-sizing:border-box}
  .card img{width:96px;height:78px;object-fit:contain;flex:none}
  .card .t{flex:1}
  .card b{display:block;color:#3F1A60;font-weight:600}
  .card small{display:block;color:#6B6578;font-size:26px}
  .btn{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;flex:none}
  .ok{background:#67A82A}
  .pend{background:#fff;border:3px solid #CDE6B5}
  .no{background:#fff;border:3px solid #F2C4BE;color:#C23B2D;font-weight:600;font-size:26px}
  .now{outline:4px solid #EE5242;outline-offset:0}
</style></head><body>
  <div class="shadow"></div>
  <img class="nutmeg" src="nutmeg.png">

  <div class="card found" style="left:670px;top:150px">
    <img src="prop-tray.svg"><div class="t"><b>Tray</b><small>the snack cart</small></div>
    <span class="btn ok"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </div>

  <div class="card found" style="left:720px;top:326px">
    <img src="prop-blanket.svg"><div class="t"><b>Blanket</b><small>the stage curtain</small></div>
    <span class="btn ok"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </div>

  <div class="card now" style="left:655px;top:502px">
    <img src="prop-bowl.svg"><div class="t"><b>Bowl</b><small>the mixing bowl</small></div>
    <span class="btn pend"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9" fill="none" stroke="#67A82A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="btn no">✕</span>
  </div>
</body></html>
