# PretendThat relay: a stateless Cloudflare Worker. See README.md for the deploy steps.
# Secrets (never in this file): OPENAI_API_KEY, ANTHROPIC_API_KEY, APP_TOKEN (and SHOWS_SECRET for round 38's show
# counts). Set them with `npx wrangler secret put`.
name = "pretendthat-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# No request logs: Workers Logs stay off, and the code never logs bodies or headers.
[observability]
enabled = false

# Per-IP rate limits (Workers Rate Limiting binding). Cloudflare only allows a 10 or 60 second period,
# and each limit is counted per Cloudflare location, so these are burst limits; the provider spend caps
# are the real ceiling. namespace_id is any number unique within the Cloudflare account.
[[ratelimits]]
name = "CLAUDE_LIMIT"
namespace_id = "7101"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "IMAGE_LIMIT"
namespace_id = "7102"
simple = { limit = 40, period = 60 }

[[ratelimits]]
name = "REALTIME_LIMIT"
namespace_id = "7103"
simple = { limit = 6, period = 60 }

# Round 19: kid-safety checks (OpenAI Moderation, free). A planning turn can check a few texts.
[[ratelimits]]
name = "MODERATION_LIMIT"
namespace_id = "7104"
simple = { limit = 60, period = 60 }

# Round 38: anonymous show counts (README "Show counts"). OFF until Haylee turns it on:
#   1. npx wrangler kv namespace create SHOWS   → paste the printed id below and uncomment the [[kv_namespaces]] block
#   2. npx wrangler secret put SHOWS_SECRET     → any long random string (openssl rand -hex 32)
#   3. set SHOW_LIMITS to "count" (count only), later "enforce" (block over the plan + require the show ticket)
[vars]
SHOW_LIMITS = "off"

# [[kv_namespaces]]
# binding = "SHOWS"
# id = "<paste the id from step 1>"

[[ratelimits]]
name = "SHOWS_LIMIT"
namespace_id = "7105"
simple = { limit = 10, period = 60 }
