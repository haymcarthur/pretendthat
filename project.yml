name: PretendThat
options:
  bundleIdPrefix: co.crimsonfoundry
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Debug.xcconfig
  Release: Release.xcconfig
packages:
  NutmegCore:
    path: NutmegCore
  # Anonymous usage counts (decisions/2026-11-17-analytics-build.md). Pinned exactly: 2.14.2 (released 2026-08-01),
  # the latest stable release; 3.0 is still in beta. App ID: Analytics.xcconfig (empty = off).
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    exactVersion: 2.14.2
targets:
  PretendThat:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Includes PretendThat/Resources/PrivacyInfo.xcprivacy (round 37), which xcodegen puts in the Resources phase.
      - path: PretendThat
    dependencies:
      - package: NutmegCore
      - package: TelemetryDeck
        product: TelemetryDeck
    settings:
      base:
        # App Store record (Crimson Foundry LLC team). Subscription product IDs stay app.pretendthat.* (StoreProducts).
        PRODUCT_BUNDLE_IDENTIFIER: co.crimsonfoundry.pretendthat
        # Company team (Tittl LLC → Crimson Foundry LLC) for every config; archives/TestFlight need it.
        # Personal-team device build: pass DEVELOPMENT_TEAM=TSM76TQF46 and a different bundle ID on the command line
        # (README → "Build for a device with the personal team"); decisions/2026-11-17-appstore-bundle-team.md.
        DEVELOPMENT_TEAM: 66898X3HH3
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: PretendThat
        INFOPLIST_FILE: PretendThat/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        # Round D4: iCloud sync of saved games (CloudKit private database, container iCloud.co.crimsonfoundry.pretendthat).
        # Only the company team has the container, so the entitlements and the container name are looked up by team:
        # a build with DEVELOPMENT_TEAM=TSM76TQF46 (the personal .dev device build) gets neither, signs without iCloud,
        # and the app stays on-device only (CloudGameSync reads PTCloudKitContainer from Info.plist; empty = off).
        PT_ENTITLEMENTS_66898X3HH3: PretendThat/Resources/PretendThat.entitlements
        PT_CLOUDKIT_CONTAINER_66898X3HH3: iCloud.co.crimsonfoundry.pretendthat
        CODE_SIGN_ENTITLEMENTS: $(PT_ENTITLEMENTS_$(DEVELOPMENT_TEAM))
        PT_CLOUDKIT_CONTAINER: $(PT_CLOUDKIT_CONTAINER_$(DEVELOPMENT_TEAM))
    postBuildScripts:
      - name: Release key check
        script: '"${SRCROOT}/tools/check-release-keys.sh"'
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
          - $(SRCROOT)/tools/check-release-keys.sh
        basedOnDependencyAnalysis: false
  # Round 38: StoreKit UI tests (SKTestSession with StoreKit/PretendThat.storekit): Free Preview → paywall, buy,
  # restore, Ask to Buy, expire, refund, free replays. Screenshots go to /tmp/pt-round38/ (simulator only).
  PretendThatUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PretendThatUITests
      - path: StoreKit/PretendThat.storekit
        buildPhase: resources
    dependencies:
      - target: PretendThat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.crimsonfoundry.pretendthat.uitests
        DEVELOPMENT_TEAM: 66898X3HH3
        TEST_TARGET_NAME: PretendThat
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
schemes:
  PretendThat:
    build:
      targets:
        PretendThat: all
        PretendThatUITests: [test]
    run:
      config: Debug
      # Round 38: local StoreKit testing when run from Xcode (the four plans, one group, the 12-month intro offers).
      storeKitConfiguration: StoreKit/PretendThat.storekit
    test:
      config: Debug
      targets:
        - PretendThatUITests
