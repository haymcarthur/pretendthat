name: PretendThat
options:
  bundleIdPrefix: app.pretendthat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Debug.xcconfig
  Release: Release.xcconfig
packages:
  NutmegCore:
    path: NutmegCore
targets:
  PretendThat:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Includes PretendThat/Resources/PrivacyInfo.xcprivacy (round 37), which xcodegen puts in the Resources phase.
      - path: PretendThat
    dependencies:
      - package: NutmegCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pretendthat.ios
        PRODUCT_NAME: PretendThat
        INFOPLIST_FILE: PretendThat/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    postBuildScripts:
      - name: Release key check
        script: '"${SRCROOT}/tools/check-release-keys.sh"'
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
          - $(SRCROOT)/tools/check-release-keys.sh
        basedOnDependencyAnalysis: false
schemes:
  PretendThat:
    build:
      targets:
        PretendThat: all
    run:
      config: Debug
