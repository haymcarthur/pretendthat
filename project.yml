name: PretendThat
options:
  bundleIdPrefix: app.pretendthat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Relay.xcconfig
  Release: Relay.xcconfig
packages:
  NutmegCore:
    path: NutmegCore
targets:
  PretendThat:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PretendThat
    dependencies:
      - package: NutmegCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pretendthat.ios
        PRODUCT_NAME: PretendThat
        INFOPLIST_FILE: PretendThat/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
schemes:
  PretendThat:
    build:
      targets:
        PretendThat: all
    run:
      config: Debug
